name: Event contract

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Editor events vs. server spec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Check event contract against server spec
        run: npm run check:events
